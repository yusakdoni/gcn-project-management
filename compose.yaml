services:
  gcn-monitor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in deployment environment}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - gcn_monitor_data:/data
volumes:
  gcn_monitor_data:
